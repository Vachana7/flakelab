[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flakelab"
version = "0.1.0"
description = "Experimental root-cause investigation for unreliable CI tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # standard library only
optional-dependencies = { dev = ["pytest>=7"] }

[project.scripts]
flakelab = "flakelab.cli:main"

[tool.setuptools]
packages = ["flakelab"]

[tool.setuptools.package-data]
flakelab = ["plugin/*.py", "dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports), I: import order,
# B: likely bugs, UP: modern syntax, ISC: implicit string concatenation (hides missing
# commas), PLW1510: subprocess.run must state whether failures raise.
select = ["E", "F", "W", "I", "B", "UP", "ISC", "PLW1510"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
