# Fast checks on every push and pull request (a few minutes).
#   quality: lint, format, type check, unit tests on two Python versions
#   docker:  build all images, then a real Docker integration test of FlakeLab
#   publish: on main only, push images to GitHub Container Registry (the "CD" part)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" ruff mypy
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy flakelab
      - name: Unit tests
        run: pytest -q

  docker:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build images
        run: |
          docker build -t flakelab:ci .
          docker build -t flakelab-demo:ci ./demo
          docker build -t flakelab-weather-api:ci ./demo/weather_api
      - name: Smoke test images
        run: |
          docker run --rm flakelab:ci --version
          docker run --rm flakelab-demo:ci python -m pytest -q tests/test_pricing.py
      - name: Start the fake weather service
        run: |
          docker network create flakelab-net
          docker run -d --name weather-api --network flakelab-net flakelab-weather-api:ci
      - name: Docker integration test (CPU, memory and network conditions)
        run: |
          pip install .
          flakelab run --runner docker --image flakelab-demo:ci \
            --docker-network flakelab-net --runs 3 \
            --conditions cpu_low,memory_low,no_network \
            --out integration-results --project "CI integration"
          python scripts/check_integration.py integration-results/results.json
      - name: Reproduction capsules on real Docker (create, replay, verify)
        run: |
          flakelab run --runner docker --image flakelab-demo:ci \
            --docker-network flakelab-net --runs 6 \
            --conditions no_network,reverse_order,timezone_ist \
            --out capsule-results --project "CI capsules"
          ls capsule-results/capsules
          cap=capsule-results/capsules
          # One-shot replay with the generated script must show the failure.
          bash "$cap/tests_test_reports.py__test_report_title/reproduce.sh" > replay.txt || true
          grep -q "FAILED tests/test_reports.py::test_report_title" replay.txt
          # Statistical verification: condition vs baseline, interleaved.
          flakelab capsule verify "$cap/tests_test_weather.py__test_delivery_forecast" --runs 4
          flakelab capsule verify "$cap/tests_test_inventory.py__test_reserve_stock" --runs 4
      - name: Same test through the FlakeLab container (Docker-out-of-Docker)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dood-results:/results" flakelab:ci run --runner docker \
            --image flakelab-demo:ci --docker-network flakelab-net --runs 1 \
            --conditions no_network --out /results
          test -f dood-results/results.json
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            integration-results/
            capsule-results/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GitHub Container Registry
        # The source label links each image to this repository. Without it, a
        # workflow's GITHUB_TOKEN is not allowed to create the package ("denied").
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry names must be lowercase
          source="https://github.com/${GITHUB_REPOSITORY}"
          for pair in "flakelab:." "flakelab-demo:./demo" "flakelab-weather-api:./demo/weather_api"; do
            name="${pair%%:*}"; context="${pair#*:}"
            image="ghcr.io/${owner}/${name}"
            docker build --label "org.opencontainers.image.source=${source}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${image}:latest" -t "${image}:${GITHUB_SHA::7}" "${context}"
            docker push --all-tags "${image}"
          done
