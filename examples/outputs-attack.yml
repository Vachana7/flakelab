# Only job "label" changed: its output is now the pull request title, which
# the author of the pull request writes. Job "notify" was not edited, but it
# pastes that output into a command and holds a secret.
on: pull_request
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.read.outputs.title }}
    steps:
      - id: read
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "title=$TITLE" >> "$GITHUB_OUTPUT"
  notify:
    runs-on: ubuntu-latest
    needs: label
    env:
      CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
    steps:
      - run: ./notify.sh "${{ needs.label.outputs.title }}"
