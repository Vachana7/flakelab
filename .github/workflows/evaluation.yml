# Formal evaluation: FlakeLab vs plain reruns at equal budget on FlakeBench
# (known-cause fixtures). Started by hand: Actions -> Evaluation -> Run workflow.
# Takes roughly 15-25 minutes with 20 runs per condition.
name: Evaluation

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per condition"
        default: "20"
        required: true

permissions:
  contents: read

concurrency:
  group: evaluation
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FlakeLab
        run: pip install .
      - name: Build FlakeBench and the fake weather service
        run: |
          docker build -t flakebench:eval ./benchmarks/flakebench
          docker build -t flakelab-weather-api:eval ./demo/weather_api
          docker network create flakelab-net
          docker run -d --name weather-api --network flakelab-net flakelab-weather-api:eval
      - name: Record the runner's hardware
        run: |
          nproc; free -m
          docker info --format '{{.NCPU}} CPUs, {{.MemTotal}} bytes, cgroup v{{.CgroupVersion}}'
      - name: Run the benchmark
        run: |
          flakelab benchmark --runner docker --image flakebench:eval \
            --docker-network flakelab-net --runs "${{ github.event.inputs.runs }}" \
            --expected benchmarks/flakebench/expected.json --out evaluation
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> evaluation/PROVENANCE.txt
          echo "commit=${{ github.sha }}" >> evaluation/PROVENANCE.txt
      - name: Add the report to the job summary
        if: always()
        run: cat evaluation/EVALUATION.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: evaluation/
