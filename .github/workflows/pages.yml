name: Website

# Publishes site/ (the product page) and dashboard/ (evaluation results) to
# GitHub Pages. Turn it on once in Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/dashboard
          cp site/index.html _site/
          cp dashboard/index.html _site/dashboard/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # Pages verifies the deployment with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
