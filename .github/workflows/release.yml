name: Release

# On a version tag (v0.5.0, ...): build the image for amd64 and arm64, push it to
# GHCR, sign it with Sigstore (keyless, no stored key), attach an SBOM and SLSA
# build provenance, and create a GitHub release.
#
# PipeDelta flags `id-token: write` as a high-level power, and it is right to:
# here it is needed for keyless signing and provenance, so it is given only to
# this job, which only runs for tags pushed by maintainers, never for pull requests.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      packages: write        # push to ghcr.io
      id-token: write        # keyless signing and provenance (Sigstore)
      attestations: write    # store the provenance attestation
    env:
      IMAGE: ghcr.io/vachana7/pipedelta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/vachana7/pipedelta
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vachana7/pipedelta
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/vachana7/pipedelta@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: pipedelta-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # How to verify the signature is in the README ("Verify the image").
        run: >-
          gh release create "$TAG" pipedelta-sbom.spdx.json --verify-tag
          --title "PipeDelta $TAG"
          --notes "Image: $IMAGE@$DIGEST (linux/amd64, linux/arm64). Signed with Sigstore, with SLSA provenance and an SPDX SBOM attached."
