name: PipeDelta
description: Report what new powers a pull request or push gives the GitHub Actions pipeline
branding:
  icon: shield
  color: blue
inputs:
  fail-on:
    description: Fail the check when a new power is at or above this level (low, medium, high, never)
    default: high
  token:
    description: Token used to post the report as a pull request comment and to look up commit ids for pin suggestions. Leave empty for no comment.
    default: ""
  zizmor:
    description: Also run zizmor on the old and new files and report its new findings in plain words (on, off)
    default: "off"
  sarif-file:
    description: Also write the findings as SARIF to this path, for github/codeql-action/upload-sarif. Leave empty for none.
    default: ""
outputs:
  level:
    description: Highest level among the new powers (none, low, medium, high)
  count:
    description: Number of new powers
runs:
  using: docker
  image: Dockerfile
  args:
    - action
    - --fail-on
    - ${{ inputs.fail-on }}
    - --zizmor
    - ${{ inputs.zizmor }}
  env:
    PIPEDELTA_TOKEN: ${{ inputs.token }}
    PIPEDELTA_SARIF: ${{ inputs.sarif-file }}
