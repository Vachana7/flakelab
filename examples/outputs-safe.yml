# The same change to job "label", but "notify" now reads the output through an
# environment variable. The shell treats "$TITLE" as data, not as commands.
on: pull_request
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.read.outputs.title }}
    steps:
      - id: read
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "title=$TITLE" >> "$GITHUB_OUTPUT"
  notify:
    runs-on: ubuntu-latest
    needs: label
    env:
      CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
    steps:
      - env:
          TITLE: ${{ needs.label.outputs.title }}
        run: ./notify.sh "$TITLE"
