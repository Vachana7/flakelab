# Job "label" publishes an output. Job "notify" needs it and pastes it into a command.
# Here the output is the commit id, which an outsider cannot choose.
on: pull_request
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.read.outputs.title }}
    steps:
      - id: read
        run: echo "title=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  notify:
    runs-on: ubuntu-latest
    needs: label
    env:
      CHAT_TOKEN: ${{ secrets.CHAT_TOKEN }}
    steps:
      - run: ./notify.sh "${{ needs.label.outputs.title }}"
