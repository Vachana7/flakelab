# Full FlakeLab experiment: started by hand (Actions tab -> Run workflow), weekly,
# or when a version tag is pushed. Publishes the live dashboard to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: FlakeLab (extended)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per condition"
        default: "15"
        required: true
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (08:47 IST)
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: flakelab-extended
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FlakeLab
        run: pip install .
      - name: Build the project under test and its fake weather service
        run: |
          docker build -t flakelab-demo:latest ./demo
          docker build -t flakelab-weather-api:latest ./demo/weather_api
          docker network create flakelab-net
          docker run -d --name weather-api --network flakelab-net flakelab-weather-api:latest
      - name: Record the runner's hardware (CPU experiments depend on it)
        run: |
          nproc; free -m; docker info --format '{{.NCPU}} CPUs, {{.MemTotal}} bytes, cgroup {{.CgroupVersion}}'
      - name: Run the experiment
        run: |
          flakelab run --runner docker --image flakelab-demo:latest \
            --docker-network flakelab-net --runs "${{ github.event.inputs.runs || '15' }}" \
            --expected demo/flakelab-expected.json \
            --out site --project "ShopLite demo (extended)"
      - name: Add the report to the job summary
        if: always()
        run: cat site/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakelab-extended-results
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-dashboard:
    needs: experiment
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
