name: Triage
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Thanks for the pull request"
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label safe-to-test
